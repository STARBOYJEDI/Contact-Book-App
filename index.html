<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Book App</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body onload="fetchContact()">
        <div id="table">Contact loading...</div>
        <button id="refresh" type="button">Refresh</button>
        <button id="addContact" type="button">Add Contact</button>

        <script src="config.js"></script>
        <script>
            document.getElementById("refresh").addEventListener('click', fetchContacts);
            document.getElementById("addContact").addEventListener('click', addContact);

            function fetchContacts() {
                fetch(rootPath + "controller/get-contacts/").then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    displayOutPut(data);
                })
                .catch(function (error) {
                    document.getElementById("table").innerHTML = "Error loading contacts.";
                    console.error("Fetch error:", error);
                })
            }
            
        </script>
    </body>
</html>
